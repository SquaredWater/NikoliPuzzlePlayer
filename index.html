<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)" />
    <title>Nikoli 谜题合集</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      // 在首次绘制前应用已保存的主题，避免闪白
      try {
        const t = localStorage.getItem('nikoli.theme');
        document.documentElement.dataset.theme = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <header class="app-bar">
      <span class="app-bar-title">Nikoli 谜题合集</span>
      <div class="app-bar-actions">
        <a class="icon-btn" href="https://github.com/SquaredWater/NikoliPuzzlePlayer" target="_blank" rel="noopener" title="查看源码" aria-label="查看源码">
          <span class="icon" data-icon="github"></span>
        </a>
        <button class="icon-btn" type="button" data-theme-toggle title="切换主题" aria-label="切换主题"></button>
      </div>
    </header>

    <main class="home">
      <section class="hero">
        <div class="hero-top">
          <span class="logo"><span class="icon" data-icon="grid"></span></span>
          <h1>挑一道题，慢慢推</h1>
        </div>
        <p class="subtitle">九种经典 Nikoli 纸笔谜题，全部由程序随机生成，每道题都保证唯一解，并且只靠逻辑就能推出。</p>

        <form class="code-entry" id="code-form" novalidate>
          <label class="field" for="code">
            <input id="code" name="code" class="code-input" spellcheck="false" autocomplete="off" placeholder="SD-9x9-M-123456" aria-describedby="code-error" />
            <span class="field-label">直接输入题号</span>
          </label>
          <button class="btn filled" type="submit" id="btn-go">
            <span class="icon" data-icon="play"></span>
            开始
          </button>
          <span id="code-error" class="error-text" role="alert"></span>
        </form>
      </section>

      <h2 class="section-title">全部谜题</h2>
      <div id="games" class="game-list"></div>
    </main>

    <script type="module" src="src/app/home.js"></script>
  </body>
</html>
