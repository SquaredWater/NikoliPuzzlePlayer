name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署；新推送排队但不取消正在进行的部署，避免站点处于半成品状态。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      # 组装 dist：只带上页面需要的文件，并给静态资源加上 ?v=<提交 SHA> 的版本号。
      # Pages 对静态文件固定缓存 10 分钟，加版本号后新页面一定会取到新的 CSS / JS。
      - run: node scripts/build.js dist "$(git rev-parse --short=12 HEAD)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
